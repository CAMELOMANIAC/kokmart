<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kokmartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#FF4800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#C23600" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="118" fill="url(#kokmartGrad)"/>
  
  <!-- Subtle Inner Ring Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="102" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4"/>

  <!-- Main Symbol: Pin + Cart / Target Motif -->
  <g filter="url(#shadow)">
