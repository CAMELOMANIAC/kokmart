    <path d="M256 100 C182 100 122 160 122 234 C122 328 238 410 250 418 C253.5 420.5 258.5 420.5 262 418 C274 410 390 328 390 234 C390 160 330 100 256 100 Z" fill="#FFFFFF"/>
    
    <!-- Pin Center Core (Primary Orange) -->
