name: Daily Jules Test Generation Trigger

on:
  schedule:
    # 매일 UTC 18:00 (한국 시간 기준 다음날 새벽 03:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 지원

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 이미 처리 대기 중이거나 열려 있는 Jules 이슈가 있는지 확인 (중복 방지)
      - name: Check for existing active Jules tasks
        id: active_check
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          OPEN_ISSUE=$(gh issue list --label "jules" --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$OPEN_ISSUE" ]; then
            echo "has_active_issue=true" >> $GITHUB_OUTPUT
            echo "⚠️ 이미 열려 있는 Jules 작업 이슈(#$OPEN_ISSUE)가 존재합니다. 새 이슈 생성을 건너뜁니다."
          else
            echo "has_active_issue=false" >> $GITHUB_OUTPUT
            echo "진행 중인 열린 Jules 이슈가 없습니다. 커밋 검사를 진행합니다."
          fi

      # 2. 최근 24시간 동안 실제 소스코드(src/)에 대한 사람의 커밋만 확인
      - name: Check human commits since yesterday 03:00 KST
        id: commit_check
        if: steps.active_check.outputs.has_active_issue == 'false'
        run: |
          # 1. 한국 시간(KST) 기준 정확히 24시간 전 시점 추출
          export TZ="Asia/Seoul"
          SINCE_DATE=$(date -d "24 hours ago" "+%Y-%m-%dT%H:%M:%S+09:00" 2>/dev/null || date -v-24H "+%Y-%m-%dT%H:%M:%S+09:00")
          echo "기준 시점 (이 시각 이후 커밋 검사): $SINCE_DATE"

          # 2. 커밋 로그 추출 (봇 커밋 및 GitHub 자동 머지 제외)
          COMMITS=$(git log --since="$SINCE_DATE" --no-merges \
            --format="%h - %an (%cn): %s" \
            -- "apps/*/src/**" "packages/*/src/**" ":!**/*.test.*" ":!**/*.spec.*" \
            | grep -v -E "\[bot\]|jules|github-actions|GitHub" || true)

          # 3. 실제 변경 파일 목록 추출
          CHANGED_FILES=$(git log --since="$SINCE_DATE" --no-merges --name-only --pretty="" \
            -- "apps/*/src/**" "packages/*/src/**" ":!**/*.test.*" ":!**/*.spec.*" \
            | sort -u | grep -v '^$' || true)

          # 공백 제거 후 빈 값 검증
          CLEAN_COMMITS=$(echo "$COMMITS" | tr -d '[:space:]')
          CLEAN_FILES=$(echo "$CHANGED_FILES" | tr -d '[:space:]')

          if [ -z "$CLEAN_COMMITS" ] || [ -z "$CLEAN_FILES" ]; then
            echo "has_commits=false" >> $GITHUB_OUTPUT
            echo "새벽 3시 기준 신규 유효 커밋이 없습니다. 이슈 생성을 건너뜁니다."
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "$COMMITS" > recent_commits.txt
            echo "$CHANGED_FILES" > changed_files.txt
            echo "테스트 대상 변경 파일 목록:"
            cat changed_files.txt
          fi

      # 3. 새로운 커밋이 있을 때만 Jules에게 이슈 발행
      - name: Create Issue for Jules
        if: steps.active_check.outputs.has_active_issue == 'false' && steps.commit_check.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > issue_body.md
          안녕하세요 Jules! 지난 24시간 동안 추가/수정된 아래 대상 파일들을 분석하고, 적절한 Vitest 단위/통합 테스트 케이스를 작성하여 PR을 생성해 주세요.

          ### 📌 최근 수정된 대상 파일 목록:
          ```text
          EOF

          cat changed_files.txt >> issue_body.md

          cat << 'EOF' >> issue_body.md
          ```

          ### 최근 신규 개발 커밋 로그:
          ```text
          EOF

          cat recent_commits.txt >> issue_body.md

          cat << 'EOF' >> issue_body.md
          ```

          ### 🎯 작업 및 우선순위 가이드:
          1. **대상 범위 한정**: 반드시 위 **[최근 수정된 대상 파일 목록]**에 명시된 파일과 직접적으로 연관된 테스트만 작성하세요. (목록 외의 다른 파일 테스트 작성 금지)
          2. **우선순위 (선별 작업)**:
             - 1순위: 비즈니스 계산 로직, 유틸리티 함수, 상태 가공 함수
             - 2순위: 사용자 인터랙션(클릭, 상태 토글, 이벤트 전파)이 포함된 컴포넌트
             - 제외 대상: 단순 스타일/CSS 컴포넌트, 단순 타입 정의(`types/`), 상수 정의 파일
             - 작업량이 많을 경우 가장 중요도가 높은 핵심 파일 **최대 2~3개**만 선별하여 집중적으로 작성하세요.
          3. **테스트 프레임워크 & 타입**:
             - 프로젝트 루트의 `vitest.config.ts` 기반 **Vitest** 및 React Testing Library 사용.
             - `any` 타입 사용 금지 및 엄격한 TypeScript 타이핑 적용.

          ### 🛡️ 작성 원칙 및 누락 대응 (중요):
          1. **기존 테스트 보존 및 억지 작성 금지**:
             - 대상 파일에 이미 `.test.ts(x)` 파일이 존재하고 기존 커버리지가 충분하다면, 단순 마운트나 형식적인 중복 테스트를 억지로 추가하지 마세요.
             - 신규 추가된 함수나 처리되지 않은 **예외 케이스(에러 핸들링, 빈 값/null 처리 등)**가 있을 때만 선별 보강하세요.
          2. **범위 초과 시 누락 파일 리포트**:
             - 작업량이 많아 이번 PR에서 테스트를 작성하지 못하고 건너뛴 대상 파일이 있다면, PR 본문 하단에 **"추후 테스트 보강 필요 목록"** 섹션을 만들고 `- [ ] 파일경로` 형태의 체크리스트로 명시해 주세요.

          ### 🌐 언어 및 메시지 규칙 (필수):
          1. **커밋 메시지**: `test: [한국어 작업 요약]` 형식으로 작성하세요. (예: `test: 바텀시트 열림/닫힘 인터랙션 Vitest 테스트 추가`)
          2. **PR 제목 및 본문**:
             - PR 제목은 한국어로 작성하세요. (예: `[테스트] 최근 수정된 소스코드 Vitest 테스트 추가`)
             - PR 본문 설명에 어떤 파일에 어떤 시나리오(인터랙션, 예외 처리 등)를 검증했는지 한국어로 자세히 설명해 주세요.

          작업 완료 후 새 브랜치를 생성하여 Pull Request를 열어주세요.
          EOF

          # 라벨 생성 및 이슈 발행
          gh label create "jules" --color "0E8A16" --description "Tasks for Google Jules agent" --force || true

          gh issue create \
            --title "[Automated] 최근 수정된 코드에 대한 Vitest 테스트 작성 요청" \
            --body-file issue_body.md \
            --label "jules"
