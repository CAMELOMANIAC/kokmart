name: Daily Jules Test Generation Trigger

on:
  schedule:
    # 매일 UTC 18:00 (한국 시간 기준 다음날 새벽 03:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 지원

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 이미 처리 대기 중이거나 열려 있는 Jules 이슈가 있는지 확인 (중복 방지)
      - name: Check for existing active Jules tasks
        id: active_check
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          OPEN_ISSUE=$(gh issue list --label "jules" --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$OPEN_ISSUE" ]; then
            echo "has_active_issue=true" >> $GITHUB_OUTPUT
            echo "⚠️ 이미 열려 있는 Jules 작업 이슈(#$OPEN_ISSUE)가 존재합니다. 새 이슈 생성을 건너뜁니다."
          else
            echo "has_active_issue=false" >> $GITHUB_OUTPUT
            echo "진행 중인 열린 Jules 이슈가 없습니다. 커밋 검사를 진행합니다."
          fi

      # 2. 최근 24시간 동안 실제 소스코드(src/)에 대한 사람의 커밋만 확인 (봇 및 설정 파일 제외)
      - name: Check human commits in the last 24 hours
        id: commit_check
        if: steps.active_check.outputs.has_active_issue == 'false'
        run: |
          COMMITS=$(git log --since="24 hours ago" --no-merges \
            --format="%h - %an: %s" \
            -- "apps/*/src/**" "packages/*/src/**" ":!**/*.test.*" ":!**/*.spec.*" \
            | grep -v -E "\[bot\]|jules|github-actions" || true)

          if [ -z "$COMMITS" ]; then
            echo "has_commits=false" >> $GITHUB_OUTPUT
            echo "최근 24시간 동안 테스트가 필요한 새로운 소스코드 커밋이 없습니다."
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "$COMMITS" > recent_commits.txt
            echo "테스트 대상 커밋 발견:"
            cat recent_commits.txt
          fi

      # 3. 새로운 커밋이 있을 때만 Jules에게 이슈 발행
      - name: Create Issue for Jules
        if: steps.active_check.outputs.has_active_issue == 'false' && steps.commit_check.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          # 이슈 본문 마크다운 파일 생성
          cat << 'EOF' > issue_body.md
          안녕하세요 Jules! 지난 24시간 동안 추가/수정된 다음 개발 커밋들을 분석하고, 적절한 Vitest 단위/통합 테스트 케이스를 작성하여 PR을 생성해 주세요.

          ### 최근 신규 개발 커밋 목록:
          ```text
          EOF

          cat recent_commits.txt >> issue_body.md

          cat << 'EOF' >> issue_body.md
          ```

          ### 테스트 작성 가이드:
          1. **테스트 프레임워크**: 프로젝트 루트의 `vitest.config.ts` 기반 **Vitest**를 사용합니다.
             - Shared 패키지: `packages/shared/src/**/*.test.ts`
             - Server API: `apps/server/api/**/*.test.ts` (supertest 활용 가능)
             - Client 컴포넌트/로직: `apps/client/src/**/*.test.ts(x)`
          2. **Strict TypeScript 준수**: `PROJECT_SPEC.md`에 명시된 대로 `any` 타입 사용을 금지하고 엄격한 타입을 적용해 주세요.
          3. **테스트 검증**: 작성한 테스트는 `pnpm test` 명령어로 실행됩니다.

          작성 완료 후 새로운 브랜치를 생성하여 Pull Request를 열어주세요.
          EOF

          # 라벨이 없을 경우 자동 생성
          gh label create "jules" --color "0E8A16" --description "Tasks for Google Jules agent" --force || true

          # 이슈 생성 (jules 라벨 부착)
          gh issue create \
            --title "[Automated] 최근 커밋에 대한 Vitest 단위/통합 테스트 작성 요청" \
            --body-file issue_body.md \
            --label "jules"
